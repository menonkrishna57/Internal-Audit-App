version: "3.9"

services:
  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── FastAPI Audit Tool ──────────────────────────────────────────────────────
  audit-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit_tool
    ports:
      - "8000:8000"
    env_file:
      - audit-tool/.env
    environment:
      - QDRANT_HOST=qdrant   # Override localhost → container name
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
