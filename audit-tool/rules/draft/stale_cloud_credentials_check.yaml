id: stale_cloud_credentials_check
title: "Stale Cloud Credentials — Admin/Root Access Keys"
severity: critical
threshold_days: 90
query: |
  SELECT
    credential_id,
    user_name,
    access_level,
    access_key_last_used
  FROM app_security.cloud_credentials
  WHERE access_level IN ('Admin', 'Root')
  AND (access_key_last_used < NOW() - INTERVAL '{threshold_days} days' 
       OR access_key_last_used IS NULL)
remediation: >
  Immediately deactivate the identified cloud access keys. Notify the 
  assigned user and the cloud infrastructure team to perform a security 
  review and rotate credentials if continued access is required.