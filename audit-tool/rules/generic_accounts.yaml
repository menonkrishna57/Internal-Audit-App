id: generic_shared_accounts
title: "Shared / Generic Account Usage"
severity: high
query: |
  SELECT
    credential_id,
    user_name,
    access_level,
    password_last_used,
    access_key_last_used
  FROM app_security.cloud_credentials cc
  WHERE NOT EXISTS (
    SELECT 1
    FROM hr_schema.employees e
    WHERE
      cc.user_name ILIKE '%' || split_part(e.full_name, ' ', 1) || '%'
      OR cc.user_name ILIKE '%' || split_part(e.full_name, ' ', 2) || '%'
  )
  ORDER BY cc.access_level DESC, cc.user_name
remediation: >
  Deactivate generic accounts or migrate them to named service accounts with
  individual accountability. Where shared accounts are operationally necessary,
  implement compensating controls (session recording, MFA, access logging).
