id: dormant_privileged_access
title: "Dormant Privileged Accounts"
severity: high
threshold_days: 90
query: |
  SELECT
    'application_permission' AS source,
    e.id AS employee_id,
    e.full_name,
    e.department,
    ap.app_name AS account_or_app,
    ap.permission_name AS role_or_level,
    ap.last_used_at AS last_used_at
  FROM app_security.application_permissions ap
  JOIN hr_schema.employees e ON e.id = ap.employee_id
  WHERE ap.is_privileged = true
    AND (
      ap.last_used_at < NOW() - INTERVAL '{threshold_days} days'
      OR ap.last_used_at IS NULL
    )

  UNION ALL

  SELECT
    'cloud_credential' AS source,
    e.id AS employee_id,
    COALESCE(e.full_name, cc.user_name) AS full_name,
    e.department,
    cc.access_level AS account_or_app,
    cc.access_level AS role_or_level,
    GREATEST(cc.password_last_used, cc.access_key_last_used) AS last_used_at
  FROM app_security.cloud_credentials cc
  LEFT JOIN hr_schema.employees e ON cc.user_name ILIKE '%' || split_part(e.full_name, ' ', 1) || '%'
  WHERE cc.access_level IN ('Admin', 'Root')
    AND (
      GREATEST(cc.password_last_used, cc.access_key_last_used) < NOW() - INTERVAL '{threshold_days} days'
      OR GREATEST(cc.password_last_used, cc.access_key_last_used) IS NULL
    )
  ORDER BY last_used_at ASC NULLS FIRST
remediation: >
  Downgrade or remove elevated privileges for accounts that have not exercised
  them within the dormancy window. Implement just-in-time (JIT) access for
  DBA and Domain Admin roles.
